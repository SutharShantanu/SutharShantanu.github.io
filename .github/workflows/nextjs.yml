name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The portfolio needs server routes (contact mailer, resume, admin API), so it lives on Vercel.
      # Pages only serves a redirect that keeps the visitor's path, query and hash.
      - name: Build redirect site
        env:
          TARGET: https://shantanusuthar.vercel.app
        run: |
          mkdir -p out
          cat > out/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Shantanu Suthar</title>
            <link rel="canonical" href="$TARGET/">
            <meta name="robots" content="noindex">
            <meta http-equiv="refresh" content="0; url=$TARGET/">
            <script>location.replace("$TARGET" + location.pathname + location.search + location.hash)</script>
          </head>
          <body><p>Moved to <a href="$TARGET/">$TARGET</a>.</p></body>
          </html>
          HTML
          cp out/index.html out/404.html
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
